name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Lint, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The OpenAPPA battery: `appa describe --check` against the built
      # server's tool list, then `appa replay`. Without an appa binary on
      # the runner it prints a skip and exits 0.
      - run: npm run test:openappa
