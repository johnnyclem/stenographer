name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Lint, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The OpenAPPA battery: `appa describe --check` against the built
      # server's tool list, then `appa replay`. The battery is written
      # against one OpenAPPA release; its installer verifies the archive
      # against the release's SHA256SUMS. APPA_REQUIRED makes a missing
      # binary a failure here instead of a skip.
      - name: Install OpenAPPA (the battery's pinned release)
        env:
          APPA_VERSION: v0.30.0
          APPA_INSTALL_DIR: ${{ runner.temp }}/appa
        run: curl -fsSL "https://github.com/archestra-ai/OpenAPPA/releases/download/${APPA_VERSION}/appa-install.sh" | sh
      - run: npm run test:openappa
        env:
          APPA_BIN: ${{ runner.temp }}/appa/appa
          APPA_REQUIRED: '1'

  # better-sqlite3 13 loads a prebuilt binary, but an install from a
  # lockfile still runs npm's implicit `node-gyp rebuild` for it, which
  # needs Python 3 and make even when it compiles nothing. node:22-slim has
  # neither: install the packed package there as MIGRATION.md says, fresh
  # and then from the lockfile that wrote, and run it.
  slim-install:
    name: Install the packed package on node:22-slim
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack --pack-destination /tmp
      - name: Install it into a new project, then again from that project's lockfile
        working-directory: /tmp
        env:
          # onnxruntime-node's postinstall would download its optional CUDA libraries
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          mkdir consumer && cd consumer
          npm init -y
          npm install /tmp/stenographer-core-*.tgz
          rm -rf node_modules
          npm ci --ignore-scripts
          npx stenographer proposals ./state.db
          npx stenographer verify ./state.db
