# stenographer battery: the stenographer MCP server (@stenographer/core
# 1.0), both tool profiles under one namespace. `stenographer start`
# serves the agent profile (reads, drafts, UVs, attestations) by default;
# `--profile operator` serves the notary's and judge's tools. A tool
# neither profile serves is not named here.
#
# Reads are labelled by what they surface. Transcript tools return
# messages the indexer took from session logs; in watch mode those are
# other sessions' logs, with text from wherever those sessions read it
# (web pages, tool output, files). Ledger tools return UVs, drafts and
# objections that agents wrote, some in sessions no policy protected, and
# objections quote transcript lines. All of it can carry text written
# outside the trajectory, so every such read is `suspicious`. All of it
# is this person's own corpus, kept in their state file, so every read is
# restricted to `self`. `get_status` returns counts, modes and identities,
# no text anyone else wrote: it keeps the session's trust.
#
# Writes into the ledger need trusted data: suspicious text cannot become
# truth, contest a TB or settle a UV unless an authority approves the
# call. Agents settle nothing: an agent's draft (`propose_tombstone`),
# verdict (`resolve_uv`) or approval (`approve`) is a UV-class claim until
# a person approves it, but three agent sessions agreeing from different
# angles nominate it (an ADDENDUM in the ledger), and an approval counts
# toward a person's promotion. So a draft and an approval are truth
# writes too: they need trusted data, and a draft records
# `stenographer.proposed` and `stenographer.changed`. Every act a person performs under their own
# name in the operator profile — notarizing, dismissing, overriding,
# ruling, and minting a TB with `signedBy` — also needs the `hitl` mark:
# the server takes that name from the caller there, so the person
# approves each such call. So does importing a team wiki file, whose
# overrides, strikes and rulings apply in their writers' names. The root
# config supplies an authority permitting `hitl`.
#
# OpenAPPA checks a call's requirements against the label its own result
# would leave, so a rule that requires `trusted` cannot also declare a
# `suspicious` result: no call could satisfy it without an authority that
# lifts trust. Write results therefore keep the session's trust. Most are
# the record of the call itself: the entry it wrote, a count, the entry a
# person just signed or overrode. Some can quote text nobody vouched
# for — the UV a resolution settles, the evidence other agent sessions
# brought to a quorum's addendum or TB (and the claim of the earliest
# draft a quorum TB takes), the earlier draft a `targetRef` dedupes
# into, the draft a dismissal rejects, and the transcript line an
# objection quotes — and the README lists that limit. Results that carry
# ledger entries are restricted to `self`.
#
# No write requires an audience. The ledger lives in the person's state
# file, read by their own sessions; a deployment that exports it to a
# shared wiki adds the audience its readers need with a root rule.

[policy]
version = 2

# --- transcript reads: other sessions' text, restricted to self ---

[[policy.tool]]
name = "mcp/stenographer/get_recent_messages"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/search_conversation"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/search_similar"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_context_frame"
delta = { audience = ["self"], trust = "suspicious" }

# Entities, relations, decisions and corrections are extracted from the
# same messages and quote them.
[[policy.tool]]
name = "mcp/stenographer/get_entities"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_relations"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_decisions"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_decision_history"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_decision_chain"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_corrections"
delta = { audience = ["self"], trust = "suspicious" }

# --- status: counts and this server's own configuration ---

[[policy.tool]]
name = "mcp/stenographer/get_status"
delta = { audience = ["self"] }

# --- ledger reads: agent-written UVs, drafts and quoted transcript lines ---

[[policy.tool]]
name = "mcp/stenographer/get_truth"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/search_truth"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_derivation"
delta = { audience = ["self"], trust = "suspicious" }

# The review docket: agents' UVs and drafts, the detector's reviews, and
# the record's passages, all written outside this trajectory.
[[policy.tool]]
name = "mcp/stenographer/get_docket"
delta = { audience = ["self"], trust = "suspicious" }

# Precedent rulings: a person's policy decisions, with opinions written
# outside this trajectory.
[[policy.tool]]
name = "mcp/stenographer/get_precedents"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_contested"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/get_verification_queue"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/list_proposals"
delta = { audience = ["self"], trust = "suspicious" }

[[policy.tool]]
name = "mcp/stenographer/list_objections"
delta = { audience = ["self"], trust = "suspicious" }

# --- truth writes: trusted data only ---

# Agent profile. Files a draft and raises it to a person; the draft that
# completes a quorum of agent sessions' drafts (the same literals, from
# different angles, within 15 minutes) mints the TB. Returns the draft,
# the earlier open draft a targetRef dedupes into, or the quorum's TB,
# whose claim and evidence other sessions wrote (see the README's limits).
[[policy.tool]]
name = "mcp/stenographer/propose_tombstone"
delta = { audience = ["self"] }
requires = { trust = "trusted" }
effects = ["stenographer.proposed", "stenographer.changed"]

# Agent profile: attributed to the server-bound agent identity. Operator
# profile: `author` names who believes it.
[[policy.tool]]
name = "mcp/stenographer/assert_uv"
delta = {}
requires = { trust = "trusted" }
effects = ["stenographer.changed"]

# Operator profile, minting a TB under a person's signature. Returns the
# UV, its addendum, and the TB and promotion ruling the person signed.
[[policy.tool]]
name = "mcp/stenographer/resolve_uv(signedBy:*)"
delta = { audience = ["self"] }
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# Agent profile: files the agent's verdict as an attestation; a verified
# one is the session's approval, which three sessions turn into a
# nomination. Operator profile, without signedBy: a person resolves it.
# Returns the UV, which its own author wrote, and what other sessions
# approved or attested (see the README's limits).
[[policy.tool]]
name = "mcp/stenographer/resolve_uv"
delta = { audience = ["self"] }
requires = { trust = "trusted" }
effects = ["stenographer.changed"]

# Agent profile: this session's approval of a UV, which counts toward a
# person's promotion and, with two other sessions', nominates it. Operator
# profile: a person's approval, which promotes with one more; the person
# is named by the caller, so it is reviewed under hitl like every act in
# a person's name. Returns the UV and the other approvals.
[[policy.tool]]
name = "mcp/stenographer/approve(by:*)"
delta = { audience = ["self"] }
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

[[policy.tool]]
name = "mcp/stenographer/approve"
delta = { audience = ["self"] }
requires = { trust = "trusted" }
effects = ["stenographer.changed"]

# Operator profile only, and always with signedBy: a TB signed with a
# person's name. No profile lets an agent sign a TB alone.
[[policy.tool]]
name = "mcp/stenographer/assert_tombstone"
delta = {}
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# Returns a count.
[[policy.tool]]
name = "mcp/stenographer/backfill_legacy_tombstones"
delta = {}
requires = { trust = "trusted" }
effects = ["stenographer.changed"]

# --- a person's acts under their own name: trusted data and fresh review ---

# The notary act: mints the draft's TB or UV under the signer's name and
# returns it. The person reviewing the call vouches for it by signing.
[[policy.tool]]
name = "mcp/stenographer/sign_proposal"
delta = { audience = ["self"] }
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# Files a dismissal ruling. Returns the dismissed draft, which its drafter
# wrote (see the README's limits).
[[policy.tool]]
name = "mcp/stenographer/dismiss_proposal"
delta = { audience = ["self"] }
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# The force path. Returns the overridden TB, which a signer vouched for,
# and the addendum this call filed.
[[policy.tool]]
name = "mcp/stenographer/override_tombstone"
delta = { audience = ["self"] }
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# Strike, promotion or contempt. Returns the ruling and, for contempt, the
# TB minted from the call's own opinion.
[[policy.tool]]
name = "mcp/stenographer/file_ruling"
delta = {}
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# Returns the ruling and the objection, which quotes the transcript line it
# was raised on (see the README's limits).
[[policy.tool]]
name = "mcp/stenographer/rule_on_objection"
delta = { audience = ["self"] }
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# Files a team wiki's lines; TBs land as truth only when signed and
# verifiable. A file can carry overrides, strikes and rulings in other
# people's names, which the import applies, so the person reviews the
# import. Returns ids, counts and reasons.
[[policy.tool]]
name = "mcp/stenographer/import_wiki_entries"
delta = { audience = ["self"] }
requires = { trust = "trusted", attention = ["hitl"] }
effects = ["stenographer.changed", "stenographer.ruled"]

# --- wiki export ---

# With file: appends the ledger's stream to a wiki file. Returns counts.
[[policy.tool]]
name = "mcp/stenographer/export_wiki_entries(file:*)"
delta = {}
requires = { trust = "trusted" }
effects = ["stenographer.exported"]

# Without it: returns the ledger's lines inline, a read.
[[policy.tool]]
name = "mcp/stenographer/export_wiki_entries"
delta = { audience = ["self"], trust = "suspicious" }
